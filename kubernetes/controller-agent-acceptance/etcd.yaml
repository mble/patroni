apiVersion: v1
kind: Service
metadata:
  name: etcd-client
spec:
  selector:
    app.kubernetes.io/name: etcd-acceptance
  ports:
    - name: client
      port: 2379
      targetPort: client

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd-acceptance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd-acceptance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd-acceptance
    spec:
      automountServiceAccountToken: false
      containers:
        - name: etcd
          image: registry.k8s.io/etcd:3.5.21-0@sha256:d58c035df557080a27387d687092e3fc2b64c6d0e3162dc51453a115f847d121
          command:
            - /usr/local/bin/etcd
          args:
            - --name=acceptance
            - --data-dir=/var/lib/etcd
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd-client.database.svc.cluster.local:2379
            - --listen-peer-urls=http://127.0.0.1:2380
            - --initial-advertise-peer-urls=http://127.0.0.1:2380
            - --initial-cluster=acceptance=http://127.0.0.1:2380
          ports:
            - name: client
              containerPort: 2379
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/etcdctl
                - endpoint
                - health
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 128Mi
