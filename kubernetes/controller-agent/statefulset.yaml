apiVersion: v1
kind: Service
metadata:
  name: patroni-split
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
    - name: patroni
      port: 8008

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patroni-split
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: patroni-split
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: database
spec:
  replicas: 3
  serviceName: patroni-split
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: patroni
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patroni
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: patroni-split
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-control
          image: patroni-agent:latest
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c]
          args:
            - chown 0:999 /run/patroni && chmod 0770 /run/patroni
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: control
              mountPath: /run/patroni
      containers:
        - name: agent
          image: patroni-agent:latest
          imagePullPolicy: IfNotPresent
          args:
            - /etc/patroni/agent.yml
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PATRONI_SCOPE
              value: patroni-split
            - name: PATRONI_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PATRONI_POSTGRESQL_CONNECT_ADDRESS
              value: $(POD_IP):5432
            - name: PATRONI_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patroni-split-postgres
                  key: superuser-password
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patroni-split-postgres
                  key: replication-password
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: [pg_isready, --host=127.0.0.1, --port=5432]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90
          readinessProbe:
            exec:
              command: [pg_isready, --host=127.0.0.1, --port=5432]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [test, -S, /run/patroni/agent.sock]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          volumeMounts:
            - name: agent-config
              mountPath: /etc/patroni
              readOnly: true
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: postgres-tmp
              mountPath: /tmp
            - name: control
              mountPath: /run/patroni

        - name: controller
          image: patroni-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - /etc/patroni/controller.yml
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PATRONI_SCOPE
              value: patroni-split
            - name: PATRONI_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PATRONI_POSTGRESQL_CONNECT_ADDRESS
              value: $(POD_IP):5432
            - name: PATRONI_RESTAPI_CONNECT_ADDRESS
              value: $(POD_IP):8008
          ports:
            - name: patroni
              containerPort: 8008
          startupProbe:
            httpGet:
              path: /liveness
              port: patroni
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /readiness
              port: patroni
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /liveness
              port: patroni
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: controller-config
              mountPath: /etc/patroni
              readOnly: true
            - name: etcd-tls
              mountPath: /etc/etcd-tls
              readOnly: true
            - name: control
              mountPath: /run/patroni
      volumes:
        - name: agent-config
          configMap:
            name: patroni-split-agent
        - name: controller-config
          configMap:
            name: patroni-split-controller
        - name: etcd-tls
          secret:
            secretName: patroni-etcd-client
        - name: postgres-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: control
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
